<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VIOS — Video Intelligence OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!--
      Loaded non-blocking on purpose. A stylesheet link is render-blocking, and
      this one points at the internet: with no connection — which is a supported
      way to run this app — the request stalls and first paint stalls with it,
      which is the whole 1.5 s launch budget spent waiting for a font. `media=print`
      makes the browser fetch it at low priority without blocking, and the onload
      promotes it once it arrives. The fallback stack renders in the meantime.
    -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      :root {
        color-scheme: dark;
        background-color: #060608;
      }
      body {
        margin: 0;
        padding: 0;
        background-color: #060608;
        color: #f1f1f5;
        font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow: hidden;
      }
      /* Chrome is not selectable; content is. Selecting a transcript line and
         copying it is a real workflow in this app, and a blanket
         `user-select: none` on body silently takes it away. */
      .vios-header,
      .vios-status-bar,
      .vios-nav,
      .vios-card,
      .segmented,
      .nav-tab {
        user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
